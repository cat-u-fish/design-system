<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B 端设计系统 - Design Token (架构优化版)</title>
    <style>
        /* --- 保持原始样式不变 --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --brand-primary: #2196F3;
            --brand-hover: #1976D2;
            --brand-active: #1565C0;

            --spacing-1: 4px;
            --spacing-2: 8px;
            --spacing-3: 12px;
            --spacing-4: 16px;
            --spacing-5: 20px;
            --spacing-6: 24px;

            --radius-sm: 2px;
            --radius-base: 4px;
            --radius-md: 6px;
            --radius-lg: 8px;

            --shadow-card-hover: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-card-active: 0 8px 24px rgba(0, 0, 0, 0.12);

            --duration-fast: 150ms;
            --duration-base: 200ms;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            line-height: 1.5;
            font-size: 13px;
            transition: background-color var(--duration-base), color var(--duration-base);
        }

        body.light {
            background: #FAFAFA;
            color: #212121;
            --bg-primary: #FFFFFF;
            --bg-secondary: #FAFAFA;
            --bg-card: #FFFFFF;
            --text-primary: #212121;
            --text-secondary: #757575;
            --text-tertiary: #9E9E9E;
            --border-light: #EEEEEE;
        }

        body.dark {
            background: #121212;
            color: #FAFAFA;
            --bg-primary: #1E1E1E;
            --bg-secondary: #121212;
            --bg-card: #1E1E1E;
            --text-primary: #FAFAFA;
            --text-secondary: #E0E0E0;
            --text-tertiary: #BDBDBD;
            --border-light: #333333;
            --shadow-card-hover: 0 4px 12px rgba(0, 0, 0, 0.5);
            --shadow-card-active: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: var(--spacing-4) var(--spacing-6);
            transition: background-color var(--duration-base), box-shadow var(--duration-base), backdrop-filter var(--duration-base);
        }

        body.light .header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        body.dark .header {
            background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .header.scrolled {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .header-container {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: var(--spacing-4);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: var(--spacing-6);
            flex-wrap: wrap;
        }

        .header-title {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-1);
        }

        .header-title h1 {
            font-size: 18px;
            font-weight: 600;
            line-height: 1.29;
            color: var(--text-primary);
        }

        .header-subtitle {
            font-size: 12px;
            font-weight: 400;
            line-height: 1.43;
            letter-spacing: 0.025em;
            color: var(--text-tertiary);
        }

        .header-stats {
            display: flex;
            gap: var(--spacing-5);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.43;
            color: var(--brand-primary);
        }

        .stat-label {
            font-size: 10px;
            font-weight: 500;
            line-height: 1.0;
            letter-spacing: 0.05em;
            color: var(--text-tertiary);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: var(--spacing-4);
            flex-wrap: wrap;
        }

        .copy-mode-selector {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .copy-mode-label {
            font-size: 10px;
            font-weight: 500;
            line-height: 1.0;
            letter-spacing: 0.05em;
            color: var(--text-tertiary);
        }

        .copy-mode-toggle {
            display: flex;
            gap: 2px;
            background: var(--bg-secondary);
            padding: 3px;
            border-radius: var(--radius-md);
        }

        .copy-mode-btn {
            padding: 4px var(--spacing-3);
            border: none;
            background: transparent;
            border-radius: var(--radius-base);
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            line-height: 1.43;
            letter-spacing: 0.025em;
            transition: all var(--duration-fast);
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .copy-mode-btn:hover {
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .copy-mode-btn.active {
            background: var(--brand-primary);
            color: #FFFFFF;
        }

        .mode-toggle {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .mode-label {
            font-size: 10px;
            font-weight: 500;
            line-height: 1.0;
            letter-spacing: 0.05em;
            color: var(--text-tertiary);
        }

        .mode-buttons {
            display: flex;
            gap: 2px;
            background: var(--bg-secondary);
            padding: 3px;
            border-radius: var(--radius-md);
        }

        .mode-btn {
            padding: 4px var(--spacing-3);
            border: none;
            background: transparent;
            border-radius: var(--radius-base);
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            line-height: 1.43;
            letter-spacing: 0.025em;
            transition: all var(--duration-fast);
            color: var(--text-secondary);
        }

        .mode-btn:hover {
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .mode-btn.active {
            background: var(--brand-primary);
            color: #FFFFFF;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: calc(90px + var(--spacing-4)) var(--spacing-4) var(--spacing-4);
        }

        .tabs {
            display: flex;
            gap: var(--spacing-2);
            flex-wrap: wrap;
            padding: var(--spacing-4);
            border-radius: var(--radius-lg);
            margin-bottom: var(--spacing-4);
            position: sticky;
            top: calc(90px + var(--spacing-2));
            z-index: 100;
        }

        body.light .tabs {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        body.dark .tabs {
            background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .tab {
            padding: var(--spacing-2) var(--spacing-4);
            background: var(--bg-secondary);
            border-radius: var(--radius-base);
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            line-height: 1.43;
            letter-spacing: 0.025em;
            transition: all var(--duration-fast);
            white-space: nowrap;
            color: var(--text-secondary);
        }

        .tab:hover {
            background: var(--bg-card);
            color: var(--text-primary);
            box-shadow: var(--shadow-card-hover);
        }

        .tab.active {
            background: var(--brand-primary);
            color: #FFFFFF;
        }

        .section {
            background: var(--bg-card);
            padding: var(--spacing-5);
            border-radius: var(--radius-lg);
            margin-bottom: var(--spacing-4);
            transition: box-shadow var(--duration-base);
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.29;
            color: var(--text-primary);
            margin-bottom: var(--spacing-4);
            display: flex;
            align-items: center;
            gap: var(--spacing-3);
        }

        .section-count {
            padding: 2px var(--spacing-2);
            border-radius: var(--radius-base);
            font-size: 10px;
            font-weight: 500;
            line-height: 1.0;
            letter-spacing: 0.05em;
            background: var(--brand-primary);
            color: #FFFFFF;
        }

        .subsection-title {
            font-size: 13px;
            font-weight: 600;
            line-height: 1.43;
            color: var(--text-secondary);
            margin: var(--spacing-5) 0 var(--spacing-3);
            padding-left: var(--spacing-2);
            border-left: 3px solid var(--brand-primary);
        }

        .token-grid {
            display: grid;
            gap: var(--spacing-3);
        }

        .token-grid.colors {
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        }

        .token-grid.compact {
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        }

        .token-grid.typography {
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        }

        .token-item {
            padding: var(--spacing-4);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--duration-base);
            position: relative;
            background: var(--bg-card);
        }

        .token-item:hover {
            box-shadow: var(--shadow-card-hover);
            transform: translateY(-2px);
        }

        .token-item.copied {
            box-shadow: 0 0 0 2px #4CAF50;
        }

        body.light .token-item.copied {
            background: #E8F5E9;
        }

        body.dark .token-item.copied {
            background: #1B5E20;
        }

        .token-name {
            font-size: 12px;
            font-weight: 500;
            line-height: 1.43;
            letter-spacing: 0.025em;
            font-family: 'JetBrains Mono', 'Consolas', 'Monaco', monospace;
            color: var(--brand-primary);
            margin-bottom: var(--spacing-2);
            word-break: break-all;
        }

        .token-value {
            font-size: 14px;
            font-weight: 500;
            line-height: 1.43;
            color: var(--text-primary);
            word-break: break-all;
            font-family: 'JetBrains Mono', 'Consolas', 'Monaco', monospace;
        }

        .token-desc {
            font-size: 12px;
            font-weight: 400;
            line-height: 1.43;
            letter-spacing: 0.025em;
            color: var(--text-tertiary);
            margin-top: var(--spacing-2);
        }

        .color-swatch {
            width: 100%;
            height: 60px;
            border-radius: var(--radius-base);
            margin-bottom: var(--spacing-3);
            border: 1px solid var(--border-light);
        }

        .shadow-preview {
            width: 100%;
            height: 60px;
            background: var(--bg-primary);
            border-radius: var(--radius-base);
            margin-bottom: var(--spacing-3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: var(--text-tertiary);
            font-weight: 600;
        }

        .spacing-preview {
            margin-bottom: var(--spacing-3);
            background: var(--bg-secondary);
            padding: var(--spacing-2);
            border-radius: var(--radius-base);
            height: 60px;
            display: flex;
            align-items: center;
        }

        .spacing-bar {
            background: var(--brand-primary);
            height: 20px;
            border-radius: var(--radius-sm);
            position: relative;
            transition: width var(--duration-base);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: var(--spacing-1);
        }

        .spacing-label {
            font-size: 10px;
            font-weight: 500;
            line-height: 1.0;
            letter-spacing: 0.05em;
            color: #FFFFFF;
        }

        .radius-preview {
            width: 100%;
            height: 60px;
            background: var(--brand-primary);
            margin-bottom: var(--spacing-3);
        }

        .font-preview {
            padding: var(--spacing-3);
            background: var(--bg-secondary);
            border-radius: var(--radius-base);
            margin-bottom: var(--spacing-3);
            min-height: 60px;
            display: flex;
            align-items: center;
            color: var(--text-primary);
        }

        .motion-preview {
            width: 100%;
            height: 60px;
            background: var(--bg-secondary);
            border-radius: var(--radius-base);
            margin-bottom: var(--spacing-3);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .motion-ball {
            width: 24px;
            height: 24px;
            background: var(--brand-primary);
            border-radius: 50%;
            position: absolute;
            left: 12px;
        }

        .motion-preview:hover .motion-ball {
            animation-play-state: running !important;
        }

        @keyframes move-linear {
            0% {
                left: 12px;
            }

            50% {
                left: calc(100% - 36px);
            }

            100% {
                left: 12px;
            }
        }

        @keyframes move-ease-out {
            0% {
                left: 12px;
            }

            50% {
                left: calc(100% - 36px);
            }

            100% {
                left: 12px;
            }
        }

        @keyframes move-ease-in {
            0% {
                left: 12px;
            }

            50% {
                left: calc(100% - 36px);
            }

            100% {
                left: 12px;
            }
        }

        @keyframes move-ease-in-out {
            0% {
                left: 12px;
            }

            50% {
                left: calc(100% - 36px);
            }

            100% {
                left: 12px;
            }
        }

        .copy-indicator {
            position: absolute;
            top: var(--spacing-2);
            right: var(--spacing-2);
            background: #4CAF50;
            color: white;
            padding: 4px var(--spacing-3);
            border-radius: var(--radius-base);
            font-size: 10px;
            font-weight: 500;
            line-height: 1.0;
            letter-spacing: 0.05em;
            opacity: 0;
            transition: opacity var(--duration-base);
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.4);
            pointer-events: none;
        }

        .token-item.copied .copy-indicator {
            opacity: 1;
        }

        .mode-badge {
            padding: 4px var(--spacing-3);
            border-radius: var(--radius-base);
            font-size: 10px;
            font-weight: 600;
            margin-left: auto;
        }

        .mode-badge.light-only {
            background: #FFF3E0;
            color: #E65100;
        }

        .mode-badge.dark-only {
            background: #E3F2FD;
            color: #1565C0;
        }

        .mode-badge.both {
            background: var(--bg-secondary);
            color: var(--text-secondary);
        }

        /* --- 新增样式：用于展示透明度叠加 --- */
        .checkered-bg {
            background-image: linear-gradient(45deg, #ccc 25%, transparent 25%),
                linear-gradient(-45deg, #ccc 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #ccc 75%),
                linear-gradient(-45deg, transparent 75%, #ccc 75%);
            background-size: 10px 10px;
            background-position: 0 0, 0 5px, 5px -5px, -5px 0px;
        }

        .layer-demo-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            height: 60px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .layer-step {
            flex: 1;
            height: 100%;
            border-radius: var(--radius-base);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-light);
            position: relative;
            overflow: hidden;
        }

        /* --- 新增样式：模糊与边框预览 --- */
        .blur-preview {
            width: 100%;
            height: 60px;
            background: url('https://images.unsplash.com/photo-1557683316-973673baf926?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=60') no-repeat center/cover;
            border-radius: var(--radius-base);
            margin-bottom: var(--spacing-3);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .blur-glass {
            width: 60%;
            height: 60%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 12px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .border-style-preview {
            width: 100%;
            height: 40px;
            background: var(--bg-secondary);
            margin-bottom: var(--spacing-3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ratio-preview {
            width: 100%;
            background: var(--bg-secondary);
            border-radius: var(--radius-base);
            margin-bottom: var(--spacing-3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 12px;
            position: relative;
        }

        .ratio-box {
            background: var(--brand-primary);
            opacity: 0.2;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        .layer-symbol {
            font-weight: bold;
            color: var(--text-tertiary);
        }

        @media (max-width: 768px) {
            .header-container {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-stats {
                width: 100%;
                justify-content: space-between;
            }

            .token-grid.colors,
            .token-grid.compact,
            .token-grid.typography {
                grid-template-columns: 1fr;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--text-tertiary);
            border-radius: var(--radius-base);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        /* --- Grid Preview --- */
        .grid-preview-container {
            width: 100%;
            height: 60px;
            background: var(--bg-secondary);
            border-radius: var(--radius-base);
            margin-bottom: var(--spacing-3);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            overflow: hidden;
        }

        .grid-row {
            display: flex;
            width: 100%;
            height: 100%;
            gap: 2px;
        }

        .grid-col {
            flex: 1;
            background: #BBDEFB;
            /* Blue 100 */
            height: 100%;
            border-radius: 1px;
        }

        body.dark .grid-col {
            background: #1565C0;
            /* Blue 800 */
        }

        .grid-gutter-preview {
            display: flex;
            gap: 16px;
            /* Dynamic */
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
        }

        .grid-gutter-col {
            width: 40px;
            height: 100%;
            background: #BBDEFB;
        }

        body.dark .grid-gutter-col {
            background: #1565C0;
        }

        .grid-margin-preview {
            width: 100%;
            height: 100%;
            background: #E3F2FD;
            /* Lighter blue */
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        body.dark .grid-margin-preview {
            background: #0D47A1;
        }

        .grid-margin-content {
            flex: 1;
            height: 100%;
            background: var(--bg-card);
            margin: 0 24px;
            /* Dynamic */
            border: 1px dashed var(--brand-primary);
            opacity: 0.8;
        }

        /* --- Density Preview --- */
        .density-preview-box {
            width: 100%;
            background: var(--bg-secondary);
            border-radius: var(--radius-base);
            margin-bottom: var(--spacing-3);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: flex-start;
            justify-content: center;
            min-height: 80px;
        }

        .density-btn {
            background: var(--bg-card);
            border: 1px solid var(--brand-primary);
            color: var(--text-primary);
            border-radius: 4px;
            font-size: 12px;
            width: 100%;
            text-align: left;
            display: flex;
            align-items: center;
        }

        .density-input {
            background: var(--bg-card);
            border: 1px solid var(--text-tertiary);
            border-radius: 4px;
            font-size: 12px;
            width: 100%;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
        }

        /* --- Z-Index Preview --- */
        .z-index-preview {
            width: 100%;
            height: 120px;
            background: var(--bg-secondary);
            border-radius: var(--radius-base);
            margin-bottom: var(--spacing-3);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .z-card {
            width: 80px;
            height: 60px;
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: 4px;
            position: absolute;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .z-card.highlight {
            background: var(--brand-primary);
            color: white;
            border-color: var(--brand-primary);
            z-index: 10;
            transform: scale(1.1);
        }

        /* --- Layout Preview --- */
        .layout-preview {
            width: 100%;
            background: var(--bg-secondary);
            border-radius: var(--radius-base);
            margin-bottom: var(--spacing-3);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .breakpoint-ruler {
            width: 100%;
            height: 24px;
            background: #E0E0E0;
            position: relative;
            border-radius: 2px;
            margin-bottom: 8px;
        }

        .breakpoint-fill {
            height: 100%;
            background: var(--brand-primary);
            opacity: 0.6;
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        .container-box {
            height: 40px;
            background: var(--bg-card);
            border: 1px dashed var(--brand-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: var(--text-secondary);

        // --- MasterGo Helper Functions ---

        // 1. Resolve Alias to Hex
        // Finds the primitive hex value for a given alias (e.g., "blue-600" -> "#1E88E5")
        function resolveTokenValue(value) {
            if (!value) return '';
            if (value.startsWith('#') || value.startsWith('rgba') || value.startsWith('transparent')) {
                return value;
            }

            // Extract alias name from format like "blue-600 (#1E88E5)" or just "blue-600"
            let alias = value.split(' ')[0];

            // Search in Color Palette
            for (const category in designTokens.colorPalette) {
                const found = designTokens.colorPalette[category].find(c => c.step === alias);
                if (found) return found.hex;
            }

            return value; // Fallback if not found
        }

        // 2. Format Name for MasterGo (Slash Naming)
        // e.g., "color-primary" -> "Color / Primary"
        function formatMasterGoName(name, prefix = '') {
            // Replace hyphens with slashes and capitalize
            const parts = name.split('-');
            const capitalized = parts.map(p => p.charAt(0).toUpperCase() + p.slice(1));
            return (prefix ? prefix + ' / ' : '') + capitalized.join(' / ');
        }

        let currentTab = 'semantic'; // Default to Semantic for MasterGo view
        let currentMode = 'light'; // For functions that still reference mode
        let currentCopyMode = 'value'; // Copy mode: name, css, or value

        // --- Helper Functions for Color Contrast ---
        function hexToRgb(hex) {
            const shorthandRegex = /^#?([a-f\d])([a-f\d])([a-f\d])$/i;
            hex = hex.replace(shorthandRegex, (m, r, g, b) => r + r + g + g + b + b);
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        function luminance(r, g, b) {
            const a = [r, g, b].map(function (v) {
                v /= 255;
                return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
            });
            return a[0] * 0.2126 + a[1] * 0.7152 + a[2] * 0.0722;
        }

        function calculateContrast(hex1, hex2) {
            const rgb1 = hexToRgb(hex1);
            const rgb2 = hexToRgb(hex2);
            if (!rgb1 || !rgb2) return null;
            const lum1 = luminance(rgb1.r, rgb1.g, rgb1.b);
            const lum2 = luminance(rgb2.r, rgb2.g, rgb2.b);
            const brightest = Math.max(lum1, lum2);
            const darkest = Math.min(lum1, lum2);
            return (brightest + 0.05) / (darkest + 0.05);
        }

        function getWCAGLevel(ratio) {
            if (ratio >= 7) return 'AAA';
            if (ratio >= 4.5) return 'AA';
            if (ratio >= 3) return 'AA Large';
            return 'Fail';
        }

        function getContrastBadge(hex) {
            if (!hex || !hex.startsWith('#')) return '';

            const whiteContrast = calculateContrast(hex, '#FFFFFF');
            const blackContrast = calculateContrast(hex, '#000000');

            if (!whiteContrast || !blackContrast) return '';

            const bestColor = whiteContrast > blackContrast ? 'White' : 'Black';
            const bestRatio = Math.max(whiteContrast, blackContrast).toFixed(2);
            const level = getWCAGLevel(Math.max(whiteContrast, blackContrast));

            return `<div style="font-size: 10px; margin-top: 4px; display: flex; gap: 4px;">
                <span style="background: rgba(0,0,0,0.1); padding: 2px 4px; border-radius: 2px;">On ${bestColor}: ${bestRatio} (${level})</span>
            </div>`;
        }

        function renderZIndex() {
            let html = '<div class="section"><h2 class="section-title">🔢 Z-Index 层级管理 <span class="section-count">' + designTokens.zindex.length + '</span></h2>';
            html += '<div class="token-grid compact">';

            const sortedZIndex = [...designTokens.zindex].sort((a, b) => parseInt(a.value) - parseInt(b.value));

            designTokens.zindex.forEach(token => {
                // Find relative position for visualization
                const index = sortedZIndex.findIndex(t => t.name === token.name);
                const total = sortedZIndex.length;

                // Generate stack visualization
                let stackHtml = '';
                // Show 3 cards: one below, one current, one above (if exist)
                const layers = [-1, 0, 1];
                layers.forEach(offset => {
                    const targetIndex = Math.max(0, Math.min(total - 1, index + offset));
                    // Only show if it makes sense visually (e.g. don't show same card twice if at edges)
                    if (offset === 0 || targetIndex !== index) {
                        const isCurrent = offset === 0;
                        const zVal = isCurrent ? 10 : (offset < 0 ? 5 : 15);
                        const scale = isCurrent ? 1.1 : 0.9;
                        const yOffset = offset * 10;
                        const xOffset = offset * 15;
                        const opacity = isCurrent ? 1 : 0.5;
                        const bg = isCurrent ? 'var(--brand-primary)' : 'var(--bg-card)';
                        const color = isCurrent ? 'white' : 'var(--text-secondary)';

                        stackHtml += `
                            <div class="z-card ${isCurrent ? 'highlight' : ''}" style="
                                z-index: ${zVal}; 
                                transform: translate(${xOffset}px, ${yOffset}px) scale(${scale});
                                opacity: ${opacity};
                            ">
                                ${isCurrent ? token.value : ''}
                            </div>
                        `;
                    }
                });

                html += `
                    <div class="token-item" data-copy-name="${token.name}" data-copy-value="${token.value}">
                        <div class="z-index-preview">
                            ${stackHtml}
                        </div>

        function setupEventListeners() {
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const mode = e.target.dataset.mode;
                    currentMode = mode;
                    document.body.className = mode;
                    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    renderContent();
                });
            });

            document.querySelectorAll('.copy-mode-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    currentCopyMode = e.target.dataset.copyMode;
                    document.querySelectorAll('.copy-mode-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                });
            });

            document.addEventListener('click', (e) => {
                if (e.target.closest('.tab')) {
                    const tab = e.target.closest('.tab');
                    currentTab = tab.dataset.tab;
                    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    renderContent();
                }

                if (e.target.closest('.token-item')) {
                    const item = e.target.closest('.token-item');
                    const name = item.dataset.copyName;
                    const value = item.dataset.copyValue;

                    let textToCopy = value;
                    if (currentCopyMode === 'name') {
                        textToCopy = name;
                    } else if (currentCopyMode === 'css') {
                        textToCopy = `--${name}`;
                    } else if (currentCopyMode === 'value') {
                        // Fix: If value format is "Name (#Hex)", extract only the Hex part
                        // Example: "red-900 (#B71C1C)" -> "#B71C1C"
                        const match = value.match(/\((#[0-9A-Fa-f]{6})\)/);
                        if (match) {
                            textToCopy = match[1];
                        }
                    }

                    navigator.clipboard.writeText(textToCopy).then(() => {
                        item.classList.add('copied');
                        setTimeout(() => item.classList.remove('copied'), 1500);
                    });
                }
            });

            window.addEventListener('scroll', () => {
                const header = document.querySelector('.header');
                if (window.scrollY > 10) {
                    header.classList.add('scrolled');
                } else {
                    header.classList.remove('scrolled');
                }
            });
        }
